<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Asset Agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l7 7-7 7-7-7z' fill='%23e2562b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/style-panel.css" />
  <link rel="stylesheet" href="/css/run.css" />
  <link rel="stylesheet" href="/css/assets.css" />
  <link rel="stylesheet" href="/css/viewer.css" />
  <link rel="stylesheet" href="/css/usage.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <div>
        <h1>Game Asset Agent</h1>
        <p>上传风格参考图 → AI 美术总监提炼风格 → 批量生成风格一致的游戏素材</p>
      </div>
    </div>
    <div class="project-bar">
      <select id="projectSelect" aria-label="选择项目"></select>
      <button id="usageBtn" class="btn ghost" title="Claude tokens 与图像调用统计">用量</button>
      <button id="newProject" class="btn ghost">新建项目</button>
      <a id="backupProject" class="btn ghost" href="#" download title="导出整个项目（参考图、风格指南、素材、对话、用量）">备份</a>
      <label class="btn ghost" title="从备份 zip 恢复为一个新项目">导入<input type="file" id="importProject" accept=".zip,application/zip" hidden /></label>
      <button id="deleteProject" class="btn ghost danger" title="删除当前项目">删除</button>
      <button id="logout" class="btn ghost" hidden>退出登录</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel" id="stylePanel">
      <h2>① 风格参考</h2>
      <label class="dropzone" id="dropzone">
        <input type="file" id="refInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
        <span>拖入或点击上传参考图（最多 8 张）</span>
        <small>截图、原画、已有素材都可以，越能代表目标风格越好</small>
      </label>
      <div class="refs" id="refs"></div>

      <div class="style-head">
        <h2>风格指南</h2>
        <span class="style-actions">
          <button id="editStyle" class="btn link">编辑</button>
          <button id="resetStyle" class="btn link" hidden>重新提炼</button>
          <button id="styleHistory" class="btn link" title="查看与恢复以前的风格指南">历史</button>
        </span>
      </div>
      <div id="styleGuide" class="style-guide empty">还没有风格指南，第一次运行时 Agent 会根据参考图自动生成。</div>
    </section>

    <section class="panel" id="runPanel">
      <h2>② 描述需求</h2>
      <div class="chips" id="typeChips"></div>
      <textarea id="request" rows="4" placeholder="例如：为一个蘑菇森林关卡做 6 个道具图标（回血蘑菇、毒蘑菇、木剑、铁盾、金币、钥匙），再做主角小狐狸的立绘和 4 帧走路动画。"></textarea>
      <div class="run-row">
        <label class="provider">图像模型
          <select id="providerSelect"></select>
        </label>
        <label class="toggle" title="Agent 会记得本项目之前的需求与结果，可以说「把刚才的剑改成蓝色」"><input type="checkbox" id="continueConv" checked /> 延续对话</label>
        <details class="budget" id="budget">
          <summary title="单次运行的上限，达到后不再生成新图">预算</summary>
          <div class="budget-pop">
            <label>图像次数上限 <input type="number" id="budgetImages" min="0" step="1" /></label>
            <label>费用上限（美元） <input type="number" id="budgetUsd" min="0" step="0.1" /></label>
            <small class="muted">留空用默认值，填 0 表示不限</small>
          </div>
        </details>
        <button id="runBtn" class="btn primary">开始生成</button>
        <button id="stopBtn" class="btn ghost" hidden>停止</button>
      </div>
      <div class="usage-bar" id="usageBar" hidden></div>
      <div class="conv-bar" id="convBar" hidden></div>
      <div class="log-head">
        <h2>Agent 工作日志</h2>
        <label class="toggle"><input type="checkbox" id="showThinking" checked /> 显示思考</label>
      </div>
      <div id="log" class="log"><p class="muted">运行后，这里会实时显示 Agent 的分析、计划、生成与审核过程。</p></div>
    </section>

    <section class="panel" id="assetPanel">
      <div class="asset-head">
        <h2>③ 素材库 <span id="assetCount" class="count"></span></h2>
        <div class="export">
          <a class="btn ghost small" id="exportApproved" href="#" download>导出已通过 ZIP</a>
          <a class="btn ghost small" id="exportAll" href="#" download>导出全部</a>
          <a class="btn ghost small" id="exportSized" href="#" download title="已通过素材 + 各类型常用尺寸">含多尺寸</a>
          <a class="btn ghost small" id="exportAtlas" href="#" download title="已通过素材打包成图集 PNG + JSON（Phaser / TexturePacker 格式），背景除外">图集</a>
        </div>
        <div class="filters" id="filters">
          <button data-filter="all" class="on">全部</button>
          <button data-filter="approved">已通过</button>
          <button data-filter="rejected">已驳回</button>
          <button data-filter="pending_review">待审核</button>
          <button id="selectToggle" class="select-toggle" type="button">选择</button>
        </div>
      </div>
      <div class="asset-search">
        <input type="search" id="assetSearch" placeholder="搜索名称 / 意见 / prompt" aria-label="搜索素材" />
        <select id="typeFilter" aria-label="按类型筛选"><option value="">全部类型</option></select>
      </div>
      <div class="batch-bar" id="batchBar" hidden>
        <span class="batch-count"></span>
        <button class="btn link" data-batch="all">全选</button>
        <button class="btn link" data-batch="none">清空</button>
        <span class="batch-actions">
          <button class="btn ghost small" data-batch="approve">✓ 通过</button>
          <button class="btn ghost small" data-batch="reject">✗ 驳回</button>
          <button class="btn ghost small" data-batch="zip">导出 ZIP</button>
          <button class="btn ghost small" data-batch="atlas">导出图集</button>
          <button class="btn ghost small danger" data-batch="delete">删除</button>
        </span>
      </div>
      <div id="assets" class="assets"></div>
    </section>
  </main>

  <dialog id="viewer">
    <form method="dialog"><button class="close" aria-label="关闭">×</button></form>
    <div class="viewer-body">
      <div class="viewer-left">
        <div class="checker viewer-img" id="viewerImgWrap"><img id="viewerImg" alt="" /></div>
        <div class="compare" id="viewerCompare" hidden></div>
      </div>
      <div class="viewer-meta" id="viewerMeta"></div>
    </div>
  </dialog>

  <dialog id="usageDialog" class="usage-dialog">
    <form method="dialog"><button class="close" aria-label="关闭">×</button></form>
    <div class="usage-body"><h3>成本与用量</h3><div id="usageBody"></div></div>
  </dialog>

  <dialog id="historyDialog" class="usage-dialog">
    <form method="dialog"><button class="close" aria-label="关闭">×</button></form>
    <div class="usage-body"><h3>风格指南历史</h3><div id="historyBody"></div></div>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
